name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Compile API docs and executable guide
        run: sbt docsCheck

  cross-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Formatting and MiMa scaffolding
        run: sbt fmtCheck mimaCheck
      - name: JVM, Node, laws, browser, and full-link gate
        run: sbt testAllFull
      - name: Representation and optimized JavaScript gate
        run: sbt representationProof
      - name: Publishable POM and package inspection
        run: |
          sbt verifyPublishArtifacts
          bash scripts/verify-publish-artifacts.sh

  numpy-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit-test NumPy compare helpers
        run: |
          python -m pip install -r modules/benchmarks/python/requirements.txt
          python modules/benchmarks/python/test_compare_access_patterns.py
      - name: Ravel vs NumPy semantic parity gate
        run: bash scripts/numpy-parity-gate.sh
        env:
          NUMPY_PARITY_SIDES: "32,64"
