name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Authoritative ravel-core release gate
        run: bash scripts/release-gate.sh
        env:
          NUMPY_PARITY_SIDES: "32,64"
      - name: Upload release-gate receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-${{ github.sha }}
          path: target/release-gate/${{ github.sha }}
          if-no-files-found: error
