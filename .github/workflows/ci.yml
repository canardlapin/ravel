name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  cross-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JVM, Node, laws, browser, and full-link gate
        run: sbt testAllFull
      - name: Representation and optimized JavaScript gate
        run: sbt representationProof
